# =============================================================================
# Master Merge Workflow  (merge-train.yml)
# =============================================================================
# The weekly integration -> master promotion train.
#
# FLOW
#   1. preflight           — is integration ahead of master?
#   2. raise-pr            — create/find promotion PR; populate body with all
#                            constituent PRs merged into integration since last
#                            master promotion + Jenkins links (pending at this point)
#   3. validate-integration — trigger Jenkins jobs on integration; gate on green;
#                            outputs the actual build URLs
#   4. update-pr-jenkins   — patch PR body with real Jenkins run URLs + results
#   5. alert-on-failure    — Teams notification + tracking issue on any failure
#   6. promote             — merge the promotion PR to master
#   7. report              — final summary as PR comment + step summary +
#                            Teams success notification
#
# CONFIG YOU MUST CONFIRM (search for "CONFIRM")
#   - Jenkins secrets: JENKINS_URL, JENKINS_USER, JENKINS_API_TOKEN
#   - Teams webhook secret: TEAMS_WEBHOOK_URL
#   - The exact Jenkins job paths + parameter names for the post-merge jobs
#   - The cron slot (currently Tuesday 04:00 UTC ~= 09:30 IST)
#   - Merge method (currently 'merge'; switch to 'squash' if you prefer)
# =============================================================================

name: Master Merge Workflow

on:
  schedule:
    # CONFIRM: cron is always UTC. Tuesday 04:00 UTC ~= 09:30 IST.
    - cron: 0 13 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate + check mergeability but do NOT merge to master'
        type: boolean
        default: true
      skip_jenkins:
        description: 'Skip Jenkins trigger/poll (testing only — treats all jobs as SUCCESS)'
        type: boolean
        default: false
      jenkins_timeout_minutes:
        description: 'Max minutes to wait for each Jenkins job to complete (default 30)'
        type: number
        default: 30

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: read

# One train at a time. Never cancel a run mid-promotion.
concurrency:
  group: main-merge-workflow
  cancel-in-progress: false

env:
  INTEGRATION_BRANCH: integration
  MASTER_BRANCH: master
  QTF_TEAM: qtf-team

jobs:
  # ===========================================================================
  # 1) Preflight — is there anything to promote?
  # ===========================================================================
  preflight:
    name: "Preflight — anything to promote?"
    runs-on: ubuntu-latest
    outputs:
      should-run:   ${{ steps.compare.outputs.should-run }}
      ahead-by:     ${{ steps.compare.outputs.ahead-by }}
      behind-by:    ${{ steps.compare.outputs.behind-by }}
      sync-needed:  ${{ steps.compare.outputs.sync-needed }}
    steps:
      - name: Compare integration vs master
        id: compare
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.QTF_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const base = process.env.MASTER_BRANCH;
            const head = process.env.INTEGRATION_BRANCH;

            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${head}`
            });
            core.info(`integration ahead by ${cmp.ahead_by}, behind by ${cmp.behind_by}`);
            core.setOutput('ahead-by',  String(cmp.ahead_by));
            core.setOutput('behind-by', String(cmp.behind_by));

            if (cmp.ahead_by === 0) {
              core.notice('Nothing to promote — integration has no new commits over master.');
              core.setOutput('should-run',  'false');
              core.setOutput('sync-needed', 'false');
              return;
            }
            if (cmp.behind_by > 0) {
              core.warning(`master is ahead of integration by ${cmp.behind_by} — will attempt auto-sync before Jenkins.`);
              core.setOutput('sync-needed', 'true');
            } else {
              core.setOutput('sync-needed', 'false');
            }
            core.setOutput('should-run', 'true');

  # ===========================================================================
  # 1b) Sync integration — if master is ahead, merge master into integration.
  #     Clean merge  → proceed (integration is now up-to-date).
  #     Conflict     → Teams alert + halt (manual resolution required).
  # ===========================================================================
  sync-integration:
    name: "Sync integration ← master"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    outputs:
      sync-result: ${{ steps.sync.outputs.sync-result }}
    steps:
      - name: Merge master into integration (if behind)
        id: sync
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.QTF_REVIEW_TOKEN }}
          script: |
            const owner  = context.repo.owner, repo = context.repo.repo;
            const base   = process.env.MASTER_BRANCH;
            const head   = process.env.INTEGRATION_BRANCH;
            const syncNeeded = '${{ needs.preflight.outputs.sync-needed }}' === 'true';
            const behindBy   = '${{ needs.preflight.outputs.behind-by }}';

            if (!syncNeeded) {
              core.info('integration is not behind master — no sync needed.');
              core.setOutput('sync-result', 'not-needed');
              return;
            }

            core.info(`master is ahead by ${behindBy} commits — attempting auto-sync merge...`);
            try {
              await github.rest.repos.merge({
                owner, repo,
                base: head,
                head: base,
                commit_message: `chore: auto-sync ${head} with ${base} [merge-train]`
              });
              core.notice(`✅ Auto-sync successful — ${head} is now up-to-date with ${base}.`);
              core.setOutput('sync-result', 'synced');
            } catch (e) {
              if (e.status === 409) {
                core.setOutput('sync-result', 'conflict');
                core.setFailed(
                  `Merge conflict detected when syncing ${base} into ${head}. ` +
                  `Manual resolution required before the merge train can proceed.`
                );
              } else {
                core.setOutput('sync-result', 'error');
                core.setFailed(`Unexpected error during auto-sync: ${e.message}`);
              }
            }

      - name: Notify Teams — sync conflict
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg runUrl "$RUN_URL" \
            --arg repo   "${{ github.repository }}" \
            --arg base   "${{ env.MASTER_BRANCH }}" \
            --arg head   "${{ env.INTEGRATION_BRANCH }}" \
            '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "msteams": {"width": "Full"},
                  "body": [
                    {"type": "TextBlock", "size": "Large", "weight": "Bolder",
                     "text": "⛔ Merge Train — Sync Conflict: master → integration", "wrap": true},
                    {"type": "FactSet", "facts": [
                      {"title": "Repository",      "value": $repo},
                      {"title": "Conflict",        "value": "Cannot auto-merge master into integration"},
                      {"title": "Action Required", "value": "Resolve conflicts manually and re-run the workflow"},
                      {"title": "Workflow Run",    "value": $runUrl}
                    ]}
                  ],
                  "actions": [{
                    "type": "Action.OpenUrl",
                    "title": "View Workflow Run",
                    "url": $runUrl
                  }]
                }
              }]
            }')
          RESP_BODY=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$RESP_BODY" -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL")
          echo "Teams HTTP status: $HTTP_STATUS"
          echo "Teams response body: $(cat "$RESP_BODY")"
          rm -f "$RESP_BODY"
          [[ "$HTTP_STATUS" =~ ^2 ]] || echo "::warning::Teams notification returned HTTP $HTTP_STATUS"

  # ===========================================================================
  # 2) Raise PR — create/find the promotion PR and populate its description
  #    with all constituent PRs + placeholder Jenkins rows BEFORE Jenkins runs.
  # ===========================================================================
  raise-pr:
    name: "Raise promotion PR"
    runs-on: ubuntu-latest
    needs: [preflight, sync-integration]
    if: |
      needs.preflight.outputs.should-run == 'true' &&
      needs.sync-integration.result == 'success'
    outputs:
      pr-number: ${{ steps.create.outputs.pr-number }}
      pr-url:    ${{ steps.create.outputs.pr-url }}
    steps:
      - name: Create or find promotion PR and populate description
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.QTF_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const base  = process.env.MASTER_BRANCH;
            const head  = process.env.INTEGRATION_BRANCH;
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // ── Collect all PRs merged into integration since last master promotion ──
            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${head}`
            });

            // Extract PR numbers from merge commit messages — handles both common formats:
            //   "Merge pull request #NNN from ..."
            //   "Some title (#NNN)"
            const prNums = new Set();
            for (const c of cmp.commits) {
              const msg = c.commit.message;
              // Format 1: GitHub default merge commit "Merge pull request #NNN"
              const m1 = msg.match(/Merge pull request #(\d+)/);
              if (m1) prNums.add(parseInt(m1[1]));
              // Format 2: squash/title suffix "(#NNN)"
              const m2 = msg.match(/\(#(\d+)\)/g);
              if (m2) m2.forEach(s => prNums.add(parseInt(s.replace(/\D/g, ''))));
            }

            // Fetch PR details for each discovered PR number
            const prRows = [];
            for (const num of [...prNums].sort((a,b) => a-b)) {
              try {
                const { data: p } = await github.rest.pulls.get({ owner, repo, pull_number: num });
                const labels = p.labels.map(l => `\`${l.name}\``).join(' ');
                const mergedAt = p.merged_at ? p.merged_at.slice(0,10) : '_open_';
                prRows.push(
                  `| [#${num}](${p.html_url}) | ${p.title} | @${p.user.login} | ${mergedAt} | ${labels || '—'} |`
                );
              } catch (e) {
                prRows.push(`| #${num} | _could not fetch_ | — | — | — |`);
              }
            }

            // Build commit table (always shown — useful when commits are pushed directly)
            const commitRows = cmp.commits.map(c => {
              const sha   = c.sha.substring(0, 7);
              const url   = c.html_url;
              const msg   = c.commit.message.split('\n')[0].replace(/\|/g, '\\|');
              const author = c.author ? `@${c.author.login}` : c.commit.author.name;
              const date  = c.commit.author.date.slice(0, 10);
              return `| [\`${sha}\`](${url}) | ${msg} | ${author} | ${date} |`;
            });

            const prTable = prRows.length
              ? [
                  `| PR | Title | Author | Merged | Labels |`,
                  `|----|-------|--------|--------|--------|`,
                  ...prRows
                ].join('\n')
              : '_No constituent PRs detected — see commit list below._';

            const commitTable = commitRows.length
              ? [
                  `| Commit | Message | Author | Date |`,
                  `|--------|---------|--------|------|`,
                  ...commitRows
                ].join('\n')
              : '_No commits found._';

            // ── Jenkins placeholder table (will be updated by update-pr-jenkins job) ──
            const jenkinsPlaceholder = [
              `| Jenkins Job | Status | Build Link |`,
              `|-------------|--------|------------|`,
              `| CheckRegressionRunReadiness | ⏳ Running… | _pending_ |`,
            ].join('\n');

            const body = [
              `## 🚂 Weekly Merge Train: \`${head}\` → \`${base}\` (${today})`,
              ``,
              `> Automated weekly promotion. Workflow run: [${context.runId}](${runUrl})`,
              ``,
              `---`,
              `## 📋 Constituent PRs (${prRows.length} PR${prRows.length !== 1 ? 's' : ''})`,
              ``,
              prTable,
              ``,
              `---`,
              `## � Commits (${commitRows.length} commit${commitRows.length !== 1 ? 's' : ''})`,
              ``,
              commitTable,
              ``,
              `---`,
              `## � Jenkins Validation`,
              ``,
              jenkinsPlaceholder,
              ``,
              `<!-- JENKINS_BLOCK_START -->`,
              jenkinsPlaceholder,
              `<!-- JENKINS_BLOCK_END -->`,
              ``,
              `---`,
              `## 📊 Final Result`,
              ``,
              `_Pending — will be updated after the workflow completes._`,
              `<!-- RESULT_BLOCK_START -->`,
              `_Pending_`,
              `<!-- RESULT_BLOCK_END -->`,
            ].join('\n');

            // Find existing open promotion PR or create one
            let pr;
            const { data: existing } = await github.rest.pulls.list({
              owner, repo, state: 'open', base, head: `${owner}:${head}`
            });
            if (existing.length) {
              pr = existing[0];
              core.info(`Existing promotion PR #${pr.number} found — updating title and description with latest details.`);
              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number,
                title: `Weekly merge train: ${head} -> ${base} (${today})`,
                body
              });
            } else {
              const { data: created } = await github.rest.pulls.create({
                owner, repo, base, head,
                title: `Weekly merge train: ${head} -> ${base} (${today})`,
                body
              });
              pr = created;
              core.info(`Created promotion PR #${pr.number}`);
            }

            core.setOutput('pr-number', String(pr.number));
            core.setOutput('pr-url',    pr.html_url);

  # ===========================================================================
  # 3) Validate integration — trigger Jenkins jobs; gate on green.
  #    Outputs the build URL for each matrix leg so the next job can patch
  #    the PR body with real links.
  # ===========================================================================
  validate-integration:
    name: "Validate integration — ${{ matrix.job }}"
    runs-on: ubuntu-latest
    needs: [preflight, sync-integration, raise-pr]
    if: |
      needs.preflight.outputs.should-run == 'true' &&
      needs.sync-integration.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        # CONFIRM: these must match your real Jenkins job names / paths.
        job: [CheckRegressionRunReadiness]
    steps:
      - name: Trigger and wait for ${{ matrix.job }} on integration
        id: jenkins
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          set -euo pipefail

          # Testing escape-hatch: skip Jenkins entirely and treat the job as successful.
          if [ "${{ inputs.skip_jenkins }}" = "true" ]; then
            echo "skip_jenkins=true — skipping Jenkins trigger, treating ${{ matrix.job }} as SUCCESS."
            echo "build-url=_skipped_" >> "$GITHUB_OUTPUT"
            echo "result=SUCCESS"      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Validate that required secrets are present before attempting any network call.
          if [ -z "${JENKINS_URL:-}" ] || [ -z "${JENKINS_USER:-}" ] || [ -z "${JENKINS_API_TOKEN:-}" ]; then
            echo "::error::One or more Jenkins secrets (JENKINS_URL, JENKINS_USER, JENKINS_API_TOKEN) are not set."
            exit 1
          fi

          # ── Diagnostics: print URL shape and DNS resolution before any real call ──
          JENKINS_HOST=$(echo "$JENKINS_URL" | sed 's|https\?://||' | cut -d'/' -f1 | tr -d '[:space:]')
          echo "JENKINS_HOST (extracted): '${JENKINS_HOST}'"
          echo "JENKINS_URL byte length : $(echo -n "$JENKINS_URL" | wc -c)"
          nslookup "$JENKINS_HOST" 2>&1 || echo "nslookup failed — host not resolvable from this runner"

          # Keep credentials OUT of the process list.
          CFG="$(mktemp)"; chmod 600 "$CFG"
          printf 'user = "%s:%s"\n' "$JENKINS_USER" "$JENKINS_API_TOKEN" > "$CFG"
          trap 'rm -f "$CFG"' EXIT

          CRUMB_RESP=$(curl -sS -K "$CFG" --connect-timeout 10 \
            "$JENKINS_URL/crumbIssuer/api/json" 2>&1) || true
          echo "Crumb response: $CRUMB_RESP"
          CRUMB=$(echo "$CRUMB_RESP" | jq -r '.crumb // empty')
          if [ -z "$CRUMB" ]; then
            echo "::error::Could not obtain Jenkins crumb. Check JENKINS_URL reachability and credentials."
            exit 1
          fi

          # CONFIRM: job path + parameter names.
          LOC=$(curl -sf -K "$CFG" -H "Jenkins-Crumb:$CRUMB" -D - -o /dev/null \
                  -X POST "$JENKINS_URL/job/${{ matrix.job }}/buildWithParameters?branch=$INTEGRATION_BRANCH" \
                | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2}' | tr -d '\r')
          echo "Queued: $LOC"

          # Queue item -> build URL (wait up to 10 min for an executor).
          QUEUE_DEADLINE=$(( $(date +%s) + 600 ))
          BUILD_URL=""
          while [ "$(date +%s)" -lt "$QUEUE_DEADLINE" ]; do
            BUILD_URL=$(curl -sf -K "$CFG" "${LOC}api/json" | jq -r '.executable.url // empty')
            [ -n "$BUILD_URL" ] && break
            sleep 10
          done
          [ -n "$BUILD_URL" ] || { echo "::error::Build never started for ${{ matrix.job }} within 10 min queue wait"; exit 1; }
          echo "Building: $BUILD_URL"
          echo "build-url=${BUILD_URL}" >> "$GITHUB_OUTPUT"

          # Poll the build to completion — timeout driven by jenkins_timeout_minutes input.
          TIMEOUT_MIN="${{ inputs.jenkins_timeout_minutes || 30 }}"
          POLL_DEADLINE=$(( $(date +%s) + TIMEOUT_MIN * 60 ))
          echo "Polling ${{ matrix.job }} for up to ${TIMEOUT_MIN} minutes..."
          while [ "$(date +%s)" -lt "$POLL_DEADLINE" ]; do
            INFO=$(curl -sf -K "$CFG" "${BUILD_URL}api/json")
            BUILDING=$(echo "$INFO" | jq -r '.building')
            RESULT=$(echo "$INFO"   | jq -r '.result // "null"')
            if [ "$BUILDING" = "false" ] && [ "$RESULT" != "null" ]; then
              echo "${{ matrix.job }} result: $RESULT"
              echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
              [ "$RESULT" = "SUCCESS" ] && exit 0 || exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out after ${TIMEOUT_MIN} min waiting for ${{ matrix.job }}"; exit 1

      - name: Write result artifact for ${{ matrix.job }}
        if: always()
        run: |
          mkdir -p /tmp/jenkins-results
          JOB_NAME="${{ matrix.job }}"
          # Read from GITHUB_OUTPUT file — reliable even when the jenkins step exits early
          BUILD_URL=$(grep '^build-url=' "$GITHUB_OUTPUT" 2>/dev/null | tail -1 | cut -d= -f2-)
          RESULT=$(grep '^result=' "$GITHUB_OUTPUT" 2>/dev/null | tail -1 | cut -d= -f2-)
          [ -z "$BUILD_URL" ] && BUILD_URL="_skipped_"
          [ -z "$RESULT"    ] && RESULT="SKIPPED"
          jq -n \
            --arg job    "$JOB_NAME" \
            --arg result "$RESULT" \
            --arg url    "$BUILD_URL" \
            '{job: $job, result: $result, buildUrl: $url}' \
            > "/tmp/jenkins-results/${JOB_NAME}.json"
          cat "/tmp/jenkins-results/${JOB_NAME}.json"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-result-${{ matrix.job }}
          path: /tmp/jenkins-results/${{ matrix.job }}.json
          retention-days: 1

  # ===========================================================================
  # 4) Update PR — patch the Jenkins block with real build URLs + results.
  # ===========================================================================
  update-pr-jenkins:
    name: "Update PR — Jenkins results"
    runs-on: ubuntu-latest
    needs: [raise-pr, validate-integration]
    if: always() && needs.raise-pr.result == 'success'
    steps:
      - name: Download all Jenkins result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jenkins-result-*
          path: /tmp/jenkins-results
          merge-multiple: true

      - name: Patch PR body with aggregated Jenkins results
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.QTF_REVIEW_TOKEN }}
          script: |
            const fs    = require('fs');
            const path  = require('path');
            const owner = context.repo.owner, repo = context.repo.repo;
            const prNum = parseInt('${{ needs.raise-pr.outputs.pr-number }}');

            // Read all downloaded result JSON files
            const dir = '/tmp/jenkins-results';
            const rows = [];
            let allPass = true;
            if (fs.existsSync(dir)) {
              for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.json'))) {
                const data = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
                const icon = data.result === 'SUCCESS' ? '✅' : (data.result === 'UNKNOWN' ? '⚠️' : '❌');
                if (data.result !== 'SUCCESS') allPass = false;
                const linkCell = data.buildUrl && data.buildUrl !== '_skipped_' && data.buildUrl !== ''
                  ? `[View build](${data.buildUrl})`
                  : data.buildUrl === '_skipped_' ? '_skipped_' : '_unavailable_';
                rows.push(`| ${data.job} | ${icon} ${data.result} | ${linkCell} |`);
              }
            }
            if (rows.length === 0) {
              rows.push('| _no results_ | ⚠️ UNKNOWN | — |');
              allPass = false;
            }

            const newBlock = [
              `| Jenkins Job | Status | Build Link |`,
              `|-------------|--------|------------|`,
              ...rows.sort()
            ].join('\n');

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNum });
            const updated = pr.body
              .replace(
                /<!-- JENKINS_BLOCK_START -->[\s\S]*?<!-- JENKINS_BLOCK_END -->/,
                `<!-- JENKINS_BLOCK_START -->\n${newBlock}\n<!-- JENKINS_BLOCK_END -->`
              );
            await github.rest.pulls.update({ owner, repo, pull_number: prNum, body: updated });
            core.info(`PR #${prNum} Jenkins block updated with ${rows.length} job(s). All pass: ${allPass}`);

  # ===========================================================================
  # 5) Alert on failure — Teams notification + tracking issue.
  #    Fires on: Jenkins failure OR promote conflict/failure.
  #    CONFIRM: create the `merge-train-alert` label once in the repo.
  # ===========================================================================
  alert-on-failure:
    name: "Alert — validation failed"
    runs-on: ubuntu-latest
    needs: [preflight, raise-pr, validate-integration]
    if: |
      failure() &&
      needs.preflight.outputs.should-run == 'true' &&
      needs.validate-integration.result == 'failure'
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.QTF_REVIEW_TOKEN }}
          script: |
            const owner  = context.repo.owner, repo = context.repo.repo;
            const qtf    = process.env.QTF_TEAM;
            const label  = 'merge-train-alert';
            const today  = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const prUrl  = '${{ needs.raise-pr.outputs.pr-url }}';
            const body   =
              `### 🔴 Merge train — integration validation failed\n\n` +
              `**Jenkins job:** CheckRegressionRunReadiness\n` +
              `**Promotion PR:** ${prUrl}\n` +
              `**Workflow run:** ${runUrl}\n\n` +
              `Promotion to \`${process.env.MASTER_BRANCH}\` is **blocked**.\n\n` +
              `@${owner}/${qtf} please triage.`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label
            });
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
              core.notice(`Updated alert issue #${open[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner, repo, labels: [label],
                title: `Merge train: integration validation failed (${today})`, body
              });
              core.notice(`Opened alert issue #${issue.number}`);
            }

      - name: Notify Teams — validation failure
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL not set — skipping Teams notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_URL="${{ needs.raise-pr.outputs.pr-url }}"
          PAYLOAD=$(jq -n \
            --arg runUrl "$RUN_URL" \
            --arg prUrl  "$PR_URL" \
            --arg repo   "${{ github.repository }}" \
            '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "msteams": {"width": "Full"},
                  "body": [
                    {"type": "TextBlock", "size": "Large", "weight": "Bolder",
                     "text": "🔴 Merge Train — Integration Validation FAILED", "wrap": true},
                    {"type": "FactSet", "facts": [
                      {"title": "Repository",      "value": $repo},
                      {"title": "Jenkins Job",     "value": "CheckRegressionRunReadiness"},
                      {"title": "Branch",          "value": "integration"},
                      {"title": "Promotion PR",    "value": $prUrl},
                      {"title": "Workflow Run",    "value": $runUrl},
                      {"title": "Action Required", "value": "Triage the failure and re-run once fixed."}
                    ]}
                  ],
                  "actions": [{
                    "type": "Action.OpenUrl",
                    "title": "View Workflow Run",
                    "url": $runUrl
                  }]
                }
              }]
            }')
          RESP_BODY=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$RESP_BODY" -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL")
          echo "Teams HTTP status: $HTTP_STATUS"
          echo "Teams response body: $(cat "$RESP_BODY")"
          rm -f "$RESP_BODY"
          [[ "$HTTP_STATUS" =~ ^2 ]] || echo "::warning::Teams notification returned HTTP $HTTP_STATUS"
          echo "Teams failure notification sent."


  # ===========================================================================
  # 6) Promote — merge the promotion PR to master.
  # ===========================================================================
  promote:
    name: "Promote integration -> master"
    runs-on: ubuntu-latest
    needs: [preflight, raise-pr, validate-integration, update-pr-jenkins]
    if: |
      needs.preflight.outputs.should-run == 'true' &&
      needs.validate-integration.result == 'success'
    steps:
      - name: Verify mergeability and merge
        id: merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.QTF_REVIEW_TOKEN }}
          script: |
            const owner  = context.repo.owner, repo = context.repo.repo;
            const base   = process.env.MASTER_BRANCH, head = process.env.INTEGRATION_BRANCH;
            const qtf    = process.env.QTF_TEAM;
            const prNum  = parseInt('${{ needs.raise-pr.outputs.pr-number }}');
            const dryRun = context.eventName === 'workflow_dispatch'
                        && context.payload.inputs?.dry_run === 'true';

            // Poll mergeability (GitHub computes it asynchronously).
            let { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNum });
            let mergeable = pr.mergeable, state = pr.mergeable_state;
            for (let i = 0; i < 12 && (mergeable === null || state === 'unknown'); i++) {
              await new Promise(r => setTimeout(r, 5000));
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNum }));
              mergeable = pr.mergeable; state = pr.mergeable_state;
            }
            core.info(`PR #${prNum} mergeable=${mergeable} state=${state}`);

            // ── Conflict off-ramp ──
            if (mergeable === false || state === 'dirty') {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNum,
                body: `### ⛔ Merge train halted — not mergeable\n\n` +
                      `\`${head}\` cannot be cleanly merged into \`${base}\`. ` +
                      `Conflicts must be resolved manually.\n\n@${owner}/${qtf} please sync and resolve.`
              });
              try {
                await github.rest.pulls.requestReviewers({
                  owner, repo, pull_number: prNum, team_reviewers: [qtf]
                });
              } catch (e) { core.warning(`Could not request QTF review: ${e.message}`); }
              core.setOutput('outcome', 'conflict');
              core.setFailed('Promotion PR not mergeable.');
              return;
            }

            if (dryRun) {
              core.notice(`Dry run — PR #${prNum} is mergeable (${state}); not merging.`);
              core.setOutput('outcome', 'dry-run');
              return;
            }

            // ── Merge ──
            try {
              const { data: res } = await github.rest.pulls.merge({
                owner, repo, pull_number: prNum, merge_method: 'merge',
                commit_title: `Weekly merge train: ${head} -> ${base} (#${prNum})`
              });
              core.notice(`Promoted! Merge SHA: ${res.sha.substring(0, 7)}`);
              core.setOutput('outcome', 'merged');
              core.setOutput('merge-sha', res.sha.substring(0, 7));
            } catch (e) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNum,
                body: `### ⚠️ Merge train — merge failed\n\n> ${e.message}\n\n@${owner}/${qtf} please investigate.`
              });
              core.setOutput('outcome', 'error');
              core.setFailed(`Merge failed: ${e.message}`);
            }

      - name: Notify Teams — promote conflict/error
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_URL="${{ needs.raise-pr.outputs.pr-url }}"
          PAYLOAD=$(jq -n \
            --arg runUrl "$RUN_URL" \
            --arg prUrl  "$PR_URL" \
            --arg repo   "${{ github.repository }}" \
            '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "msteams": {"width": "Full"},
                  "body": [
                    {"type": "TextBlock", "size": "Large", "weight": "Bolder",
                     "text": "⚠️ Merge Train — Promotion BLOCKED or FAILED", "wrap": true},
                    {"type": "FactSet", "facts": [
                      {"title": "Repository",      "value": $repo},
                      {"title": "Promotion PR",    "value": $prUrl},
                      {"title": "Workflow Run",    "value": $runUrl},
                      {"title": "Action Required", "value": "Check the PR for conflict details and resolve manually."}
                    ]}
                  ],
                  "actions": [{
                    "type": "Action.OpenUrl",
                    "title": "View Promotion PR",
                    "url": $prUrl
                  }]
                }
              }]
            }')
          RESP_BODY=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$RESP_BODY" -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL")
          echo "Teams HTTP status: $HTTP_STATUS"
          echo "Teams response body: $(cat "$RESP_BODY")"
          rm -f "$RESP_BODY"
          [[ "$HTTP_STATUS" =~ ^2 ]] || echo "::warning::Teams notification returned HTTP $HTTP_STATUS"

  # ===========================================================================
  # 7) Report — always: update PR body final result + step summary + Teams.
  # ===========================================================================
  report:
    name: "Report"
    runs-on: ubuntu-latest
    needs: [preflight, sync-integration, raise-pr, validate-integration, alert-on-failure, promote]
    if: always()
    steps:
      - name: Build final status strings
        id: status
        run: |
          VAL="${{ needs.validate-integration.result }}"
          PROM="${{ needs.promote.result }}"
          ALERT="${{ needs.alert-on-failure.result }}"
          SYNC="${{ needs.sync-integration.result }}"

          if   [ "$SYNC" = "failure" ];                                  then OVERALL="⛔ Sync conflict — master could not be merged into integration"
          elif [ "$VAL"  = "success" ] && [ "$PROM" = "success" ]; then OVERALL="✅ Promoted to master"
          elif [ "$VAL"  = "success" ] && [ "$PROM" = "skipped" ]; then OVERALL="⏭️ Validation passed — promotion skipped (dry run or no-op)"
          elif [ "$VAL"  = "failure" ]; then OVERALL="❌ Integration validation FAILED — promotion blocked"
          elif [ "$PROM" = "failure" ]; then OVERALL="⚠️ Validation passed but promotion FAILED"
          else OVERALL="⚠️ Unexpected state — check workflow logs"
          fi
          echo "overall=${OVERALL}" >> "$GITHUB_OUTPUT"

          VAL_ICON="$([ "$VAL"   = "success" ] && echo ✅ || ([ "$VAL"   = "skipped" ] && echo ⏭️ || echo ❌))"
          PROM_ICON="$([ "$PROM" = "success" ] && echo ✅ || ([ "$PROM"  = "skipped" ] && echo ⏭️ || echo ❌))"
          SYNC_ICON="$([ "$SYNC" = "success" ] && echo ✅ || ([ "$SYNC"  = "skipped" ] && echo ⏭️ || echo ⛔))"
          ALERT_ICON="$([ "$ALERT" = "skipped" ] && echo — || echo 🔔)"
          echo "val-icon=${VAL_ICON}"     >> "$GITHUB_OUTPUT"
          echo "prom-icon=${PROM_ICON}"   >> "$GITHUB_OUTPUT"
          echo "sync-icon=${SYNC_ICON}"   >> "$GITHUB_OUTPUT"
          echo "alert-icon=${ALERT_ICON}" >> "$GITHUB_OUTPUT"

      - name: Update PR body — final result block
        if: needs.raise-pr.result == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.QTF_REVIEW_TOKEN }}
          script: |
            const owner  = context.repo.owner, repo = context.repo.repo;
            const prNum  = parseInt('${{ needs.raise-pr.outputs.pr-number }}');
            const overall = `${{ steps.status.outputs.overall }}`;
            const runUrl  = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const resultBlock = [
              `**Status:** ${overall}`,
              `**Workflow run:** [${context.runId}](${runUrl})`,
              `**Completed:** ${new Date().toISOString()}`,
            ].join('\n');

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNum });
            const updated = pr.body
              .replace(
                /<!-- RESULT_BLOCK_START -->[\s\S]*?<!-- RESULT_BLOCK_END -->/,
                `<!-- RESULT_BLOCK_START -->\n${resultBlock}\n<!-- RESULT_BLOCK_END -->`
              );
            await github.rest.pulls.update({ owner, repo, pull_number: prNum, body: updated });

            // Also post a comment with the final summary so it appears in the PR timeline.
            const valResult   = '${{ needs.validate-integration.result }}';
            const promResult  = '${{ needs.promote.result }}';
            const alertResult = '${{ needs.alert-on-failure.result }}';
            const syncResult  = '${{ needs.sync-integration.result }}';

            const comment = [
              `## 📊 Master Merge Workflow — Final Report`,
              ``,
              `**${overall}**`,
              ``,
              `| Step | Result |`,
              `|------|--------|`,
              `| Preflight | ✅ |`,
              `| Sync integration ← master | ${{ steps.status.outputs.sync-icon }} ${syncResult} |`,
              `| Raise PR | ✅ PR #${prNum} |`,
              `| Jenkins validation | ${{ steps.status.outputs.val-icon }} ${valResult} (see PR body for per-job details) |`,
              `| QTF Alert | ${{ steps.status.outputs.alert-icon }} ${alertResult} |`,
              `| Promote | ${{ steps.status.outputs.prom-icon }} ${promResult} |`,
              ``,
              `Workflow run: [${context.runId}](${runUrl})`,
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body: comment });
            core.info(`Final report comment posted on PR #${prNum}.`);

      - name: Write step summary
        run: |
          {
            echo "## 🚂 Master Merge Workflow — Run Summary"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Anything to promote | ${{ needs.preflight.outputs.should-run == 'true' && 'Yes' || 'No' }} |"
            echo "| Sync integration ← master | ${{ needs.sync-integration.result }} |"
            echo "| Integration validation | ${{ needs.validate-integration.result }} |"
            echo "| QTF alert | ${{ needs.alert-on-failure.result }} |"
            echo "| Promotion | ${{ needs.promote.result }} |"
            echo ""
            echo "**Overall:** ${{ steps.status.outputs.overall }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Teams — success
        if: needs.promote.result == 'success'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          # CONFIRM: set TEAMS_WEBHOOK_URL secret to your incoming webhook URL.
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL not set — skipping Teams notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_URL="${{ needs.raise-pr.outputs.pr-url }}"
          AHEAD="${{ needs.preflight.outputs.ahead-by }}"
          PAYLOAD=$(jq -n \
            --arg runUrl "$RUN_URL" \
            --arg prUrl  "$PR_URL" \
            --arg ahead  "$AHEAD" \
            --arg repo   "${{ github.repository }}" \
            '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "msteams": {"width": "Full"},
                  "body": [
                    {"type": "TextBlock", "size": "Large", "weight": "Bolder",
                     "text": "✅ Merge Train — Integration Promoted to Master", "wrap": true},
                    {"type": "FactSet", "facts": [
                      {"title": "Repository",       "value": $repo},
                      {"title": "Commits promoted", "value": $ahead},
                      {"title": "Promotion PR",     "value": $prUrl},
                      {"title": "Workflow run",     "value": $runUrl}
                    ]}
                  ],
                  "actions": [{
                    "type": "Action.OpenUrl",
                    "title": "View Promotion PR",
                    "url": $prUrl
                  }]
                }
              }]
            }')
          RESP_BODY=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$RESP_BODY" -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL")
          echo "Teams HTTP status: $HTTP_STATUS"
          echo "Teams response body: $(cat "$RESP_BODY")"
          rm -f "$RESP_BODY"
          [[ "$HTTP_STATUS" =~ ^2 ]] || echo "::warning::Teams notification returned HTTP $HTTP_STATUS"
          echo "Teams success notification sent."

